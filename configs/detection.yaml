# Detection model configuration

player_detector:
  model: models/yolov8n.pt  # Ultralytics YOLOv8 nano (COCO pre-trained)
  classes: [0]  # COCO class 0 = person
  confidence: 0.5
  input_size: 1280  # Downscaled from 4K
  device: auto  # auto | cpu | cuda:0

ball_detector:
  model: models/yolov8n.pt  # Same model, class 32 = sports ball
  classes: [32]  # COCO class 32 = sports ball
  confidence: 0.2  # Lower threshold for small ball
  high_confidence: 0.6  # Direct accept
  input_size: 480  # Per tile - smaller works better for ball detection
  device: auto
  use_tiling: false  # Disable tiling - ball at tile boundaries gets missed. Use whole-frame detection.
  search_window_expansion: 2.0  # x bbox size for local search

tracking:
  tracker: bytetrack.yaml  # bytetrack.yaml | ocsort.yaml | botsort.yaml
  track_buffer: 90  # frames to keep lost tracks (increased for stability)

team_classification:
  method: color_histogram  # color_histogram | learned
  histogram_space: lab  # LAB color space
  vote_window: 30  # frames for temporal majority vote
  min_confidence: 0.6
  # Optional: pre-set team colors (RGB) from UI seed selection
  team_a_color_seed: null
  team_b_color_seed: null
