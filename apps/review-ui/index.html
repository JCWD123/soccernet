<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球AI实时统计仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0f19;--card:#141b2d;--card2:#1a2340;--border:#1e2d4a;--accent:#00e676;--accent2:#448aff;--accent3:#ffab40;--red:#ff5252;--text:#e0e0e0;--dim:#607d8b;--glow:rgba(0,230,118,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.topbar h1 span{color:var(--accent)}
.topbar .controls{display:flex;gap:10px;align-items:center}
.btn{padding:8px 18px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:8px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#00c853}
input[type=file]{display:none}
.speed-btn{padding:4px 10px;border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:6px;cursor:pointer;font-size:0.75rem}
.speed-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,230,118,0.1)}

/* Main layout */
.main{display:grid;grid-template-columns:1fr 380px;gap:0;height:calc(100vh - 53px)}

/* Video panel */
.video-panel{position:relative;background:#000;display:flex;flex-direction:column}
.video-panel video{width:100%;flex:1;object-fit:contain;background:#000}
.video-bar{padding:8px 16px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;font-size:0.8rem}
.video-bar .time{color:var(--accent);font-family:monospace;min-width:80px}
.video-bar input[type=range]{flex:1;accent-color:var(--accent)}
.play-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.play-btn:hover{background:var(--accent);color:#000}
.drop-zone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,15,25,0.95);z-index:10;cursor:pointer;transition:all 0.3s}
.drop-zone:hover{background:rgba(11,15,25,0.85)}
.drop-zone.hidden{display:none}
.drop-zone .icon{font-size:4rem;margin-bottom:16px}
.drop-zone p{color:var(--dim);font-size:0.95rem}
.drop-zone .hint{color:var(--dim);font-size:0.75rem;margin-top:8px}

/* Dashboard panel */
.dash{overflow-y:auto;background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--border)}
.dash::-webkit-scrollbar{width:4px}
.dash::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Scoreboard */
.scoreboard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.scoreboard .teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.team-name{font-size:1rem;font-weight:700}
.team-name.a{color:var(--red)}
.team-name.b{color:var(--accent2)}
.score{font-size:2rem;font-weight:700;color:var(--accent);font-family:monospace}
.clock{font-size:0.85rem;color:var(--dim);margin-top:4px;font-family:monospace}

/* Stat bars */
.stat-bars{display:flex;flex-direction:column;gap:8px}
.stat-bar-row{display:grid;grid-template-columns:50px 1fr 60px 1fr 50px;align-items:center;gap:6px;font-size:0.8rem}
.stat-bar-row .label{color:var(--dim);text-align:center;font-size:0.7rem}
.stat-bar-row .val{font-weight:600;font-family:monospace}
.stat-bar-row .val.a{color:var(--red);text-align:right}
.stat-bar-row .val.b{color:var(--accent2);text-align:left}
.bar-wrap{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width 0.3s ease}
.bar-fill.a{background:linear-gradient(90deg,var(--red),#ff8a80);float:right}
.bar-fill.b{background:linear-gradient(90deg,#82b1ff,var(--accent2));float:left}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h3{font-size:0.8rem;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card canvas{max-height:160px}

/* Detection info */
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det-item{background:var(--card2);border-radius:8px;padding:10px;text-align:center}
.det-item .num{font-size:1.8rem;font-weight:700;font-family:monospace}
.det-item .label{font-size:0.7rem;color:var(--dim)}
.det-item.players .num{color:var(--accent)}
.det-item.ball .num{color:var(--accent3)}
.det-item.poss .num{color:var(--accent2)}
.det-item.atk .num{color:#ab47bc}

/* Events log */
.events-log{max-height:160px;overflow-y:auto;font-size:0.75rem}
.events-log::-webkit-scrollbar{width:3px}
.events-log::-webkit-scrollbar-thumb{background:var(--border)}
.event-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);align-items:center}
.event-row .time{color:var(--dim);font-family:monospace;min-width:45px}
.event-row .type{padding:1px 8px;border-radius:10px;font-size:0.7rem;font-weight:600}
.event-row .type.pos{background:rgba(0,230,118,0.15);color:var(--accent)}
.event-row .type.atk{background:rgba(171,71,188,0.2);color:#ce93d8}
.event-row .type.ball{background:rgba(255,171,64,0.2);color:var(--accent3)}
.event-row .type.lost{background:rgba(255,82,82,0.15);color:var(--red)}
.event-row .msg{color:var(--dim);flex:1}

@media(max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}}
</style>
</head>
<body>

<div class="topbar">
  <h1>⚽ <span>足球AI</span>实时统计仪表盘</h1>
  <div class="controls">
    <label class="btn" for="videoUpload">📁 选择视频</label>
    <input type="file" id="videoUpload" accept="video/*">
    <label class="btn" for="timelineUpload">📊 导入数据</label>
    <input type="file" id="timelineUpload" accept=".json">
    <span style="color:var(--dim);font-size:0.75rem">速度:</span>
    <button class="speed-btn" data-speed="0.5">0.5x</button>
    <button class="speed-btn active" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="2">2x</button>
    <button class="speed-btn" data-speed="4">4x</button>
  </div>
</div>

<div class="main">
  <!-- Video Panel -->
  <div class="video-panel">
    <div class="drop-zone" id="dropZone">
      <div class="icon">🎬</div>
      <p>点击选择或拖拽足球比赛视频</p>
      <p class="hint">支持 MP4 / MKV / AVI 格式</p>
      <p class="hint" style="margin-top:12px;color:var(--accent)">或直接播放已有的标注视频 (data/live_demo/annotated.mp4)</p>
      <button class="btn primary" style="margin-top:16px" onclick="loadDefaultVideo()">▶ 加载演示视频</button>
    </div>
    <video id="video" crossorigin="anonymous"></video>
    <div class="video-bar">
      <button class="play-btn" id="playBtn">▶</button>
      <span class="time" id="timeDisplay">00:00 / 00:00</span>
      <input type="range" id="seekBar" min="0" max="1000" value="0">
      <span style="color:var(--dim);font-size:0.75rem" id="fpsDisplay"></span>
    </div>
  </div>

  <!-- Dashboard Panel -->
  <div class="dash">
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="teams">
        <div class="team-name a" id="teamAName">Team A</div>
        <div class="score"><span id="scoreA">0</span> — <span id="scoreB">0</span></div>
        <div class="team-name b" id="teamBName">Team B</div>
      </div>
      <div class="clock" id="clockDisplay">⏱ 00:00 / 00:00</div>
    </div>

    <!-- Possession & Stats Bars -->
    <div class="card">
      <h3>📊 实时数据</h3>
      <div class="stat-bars" id="statBars"></div>
    </div>

    <!-- Detection Grid -->
    <div class="det-grid">
      <div class="det-item players">
        <div class="num" id="detPlayers">0</div>
        <div class="label">检测球员</div>
      </div>
      <div class="det-item ball">
        <div class="num" id="detBall">-</div>
        <div class="label">足球状态</div>
      </div>
      <div class="det-item poss">
        <div class="num" id="detPoss">50%</div>
        <div class="label">控球率 A</div>
      </div>
      <div class="det-item atk">
        <div class="num" id="detAtk">0</div>
        <div class="label">总进攻</div>
      </div>
    </div>

    <!-- Possession Chart -->
    <div class="card">
      <h3>📈 控球率趋势</h3>
      <canvas id="possChart"></canvas>
    </div>

    <!-- Detection Chart -->
    <div class="card">
      <h3>🔍 检测数量</h3>
      <canvas id="detChart"></canvas>
    </div>

    <!-- Attack Chart -->
    <div class="card">
      <h3>⚔️ 进攻/危险进攻</h3>
      <canvas id="atkChart"></canvas>
    </div>

    <!-- Events Log -->
    <div class="card">
      <h3>📋 事件日志</h3>
      <div class="events-log" id="eventsLog"></div>
    </div>
  </div>
</div>

<script>
// === Global State ===
let timeline = [];
let currentIdx = 0;
let isPlaying = false;
let charts = {};
const video = document.getElementById('video');
const playBtn = document.getElementById('playBtn');
const seekBar = document.getElementById('seekBar');
const timeDisplay = document.getElementById('timeDisplay');
const clockDisplay = document.getElementById('clockDisplay');

// === Stat bar definitions ===
const statDefs = [
  { label: '控球率', keyA: 'poss_a', keyB: 'poss_b', suffix: '%' },
  { label: '进攻', keyA: 'atk_a', keyB: 'atk_b' },
  { label: '危险进攻', keyA: 'dng_a', keyB: 'dng_b' },
];

function initStatBars() {
  const el = document.getElementById('statBars');
  el.innerHTML = statDefs.map(s => `
    <div class="stat-bar-row">
      <span class="val a" id="sv_a_${s.keyA}">0</span>
      <div class="bar-wrap"><div class="bar-fill a" id="sb_a_${s.keyA}" style="width:50%"></div></div>
      <span class="label">${s.label}</span>
      <div class="bar-wrap"><div class="bar-fill b" id="sb_b_${s.keyB}" style="width:50%"></div></div>
      <span class="val b" id="sv_b_${s.keyB}">0</span>
    </div>
  `).join('');
}
initStatBars();

// === Charts ===
function initCharts() {
  const gridColor = 'rgba(255,255,255,0.06)';
  const tickColor = '#546e7a';
  const commonOpts = {
    responsive: true, animation: { duration: 0 },
    plugins: { legend: { display: true, labels: { color: tickColor, font: { size: 10 } } } },
    scales: {
      x: { ticks: { color: tickColor, font: { size: 9 }, maxTicksLimit: 10 }, grid: { color: gridColor } },
      y: { ticks: { color: tickColor, font: { size: 9 } }, grid: { color: gridColor } }
    }
  };

  // Possession chart
  charts.poss = new Chart(document.getElementById('possChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Team A', data: [], borderColor: '#ff5252', backgroundColor: 'rgba(255,82,82,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
        { label: 'Team B', data: [], borderColor: '#448aff', backgroundColor: 'rgba(68,138,255,0.08)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
      ]
    },
    options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, min: 0, max: 100, ticks: { ...commonOpts.scales.y.ticks, callback: v => v + '%' } } } }
  });

  // Detection chart
  charts.det = new Chart(document.getElementById('detChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Players', data: [], borderColor: '#00e676', backgroundColor: 'rgba(0,230,118,0.1)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
        { label: 'Ball', data: [], borderColor: '#ffab40', backgroundColor: 'rgba(255,171,64,0.15)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
      ]
    },
    options: commonOpts
  });

  // Attack chart
  charts.atk = new Chart(document.getElementById('atkChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'ATK A', data: [], borderColor: '#ff8a80', tension: 0.3, pointRadius: 0, borderWidth: 1.5, borderDash: [4,2] },
        { label: 'ATK B', data: [], borderColor: '#82b1ff', tension: 0.3, pointRadius: 0, borderWidth: 1.5, borderDash: [4,2] },
        { label: 'DNG A', data: [], borderColor: '#ff5252', tension: 0.3, pointRadius: 0, borderWidth: 2 },
        { label: 'DNG B', data: [], borderColor: '#448aff', tension: 0.3, pointRadius: 0, borderWidth: 2 },
      ]
    },
    options: commonOpts
  });
}
initCharts();

// === Update functions ===
function updateDashboard(point) {
  if (!point) return;
  const t = point.time_s.toFixed(1) + 's';

  // Stat bars
  statDefs.forEach(s => {
    const va = point[s.keyA], vb = point[s.keyB];
    const maxV = Math.max(va, vb, 1);
    document.getElementById(`sv_a_${s.keyA}`).textContent = va + (s.suffix || '');
    document.getElementById(`sv_b_${s.keyB}`).textContent = vb + (s.suffix || '');
    document.getElementById(`sb_a_${s.keyA}`).style.width = (va / maxV * 100) + '%';
    document.getElementById(`sb_b_${s.keyB}`).style.width = (vb / maxV * 100) + '%';
  });

  // Detection grid
  document.getElementById('detPlayers').textContent = point.players;
  document.getElementById('detBall').textContent = point.ball ? '✅ 检出' : '❌ 未检出';
  document.getElementById('detPoss').textContent = point.poss_a + '%';
  document.getElementById('detAtk').textContent = point.atk_a + point.atk_b;

  // Scoreboard
  document.getElementById('clockDisplay').textContent = `⏱ ${formatTime(point.time_s)} / ${formatTime(timeline[timeline.length-1]?.time_s || 0)}`;

  // Charts - update with visible window (last N points)
  const windowSize = 60;
  const start = Math.max(0, currentIdx - windowSize);
  const visible = timeline.slice(start, currentIdx + 1);
  const labels = visible.map(p => p.time_s.toFixed(1) + 's');

  charts.poss.data.labels = labels;
  charts.poss.data.datasets[0].data = visible.map(p => p.poss_a);
  charts.poss.data.datasets[1].data = visible.map(p => p.poss_b);
  charts.poss.update('none');

  charts.det.data.labels = labels;
  charts.det.data.datasets[0].data = visible.map(p => p.players);
  charts.det.data.datasets[1].data = visible.map(p => p.ball);
  charts.det.update('none');

  charts.atk.data.labels = labels;
  charts.atk.data.datasets[0].data = visible.map(p => p.atk_a);
  charts.atk.data.datasets[1].data = visible.map(p => p.atk_b);
  charts.atk.data.datasets[2].data = visible.map(p => p.dng_a);
  charts.atk.data.datasets[3].data = visible.map(p => p.dng_b);
  charts.atk.update('none');

  // Log significant events
  logEvents(point);
}

function logEvents(point) {
  const log = document.getElementById('eventsLog');
  const prev = currentIdx > 0 ? timeline[currentIdx - 1] : null;
  if (!prev) return;

  // Possession change
  if (Math.abs(point.poss_a - prev.poss_a) > 8) {
    const team = point.poss_a > prev.poss_a ? 'A' : 'B';
    const cls = team === 'A' ? 'pos' : 'pos';
    addLogEntry(point.time_s, '控球', cls, `Team ${team} 控球率上升`);
  }
  // Attack increase
  if (point.atk_a > prev.atk_a) addLogEntry(point.time_s, '进攻', 'atk', `Team A 进攻 +1`);
  if (point.atk_b > prev.atk_b) addLogEntry(point.time_s, '进攻', 'atk', `Team B 进攻 +1`);
  if (point.dng_a > prev.dng_a) addLogEntry(point.time_s, '危险', 'atk', `Team A 危险进攻 +1`);
  if (point.dng_b > prev.dng_b) addLogEntry(point.time_s, '危险', 'atk', `Team B 危险进攻 +1`);
  // Ball lost/found
  if (point.ball && !prev.ball) addLogEntry(point.time_s, '球', 'ball', '足球重新检出');
  if (!point.ball && prev.ball) addLogEntry(point.time_s, '球', 'lost', '足球丢失');
}

function addLogEntry(time, type, cls, msg) {
  const log = document.getElementById('eventsLog');
  const row = document.createElement('div');
  row.className = 'event-row';
  row.innerHTML = `<span class="time">${formatTime(time)}</span><span class="type ${cls}">${type}</span><span class="msg">${msg}</span>`;
  log.prepend(row);
  // Keep max50 entries
  while (log.children.length > 50) log.removeChild(log.lastChild);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

// === Video sync ===
function syncToVideo() {
  if (!timeline.length || !video.duration) return;
  const t = video.currentTime;
  // Find closest timeline point
  let idx = 0;
  for (let i = timeline.length - 1; i >= 0; i--) {
    if (timeline[i].time_s <= t) { idx = i; break; }
  }
  if (idx !== currentIdx) {
    currentIdx = idx;
    updateDashboard(timeline[idx]);
  }
  // Update seek bar
  seekBar.value = (t / video.duration * 1000);
  timeDisplay.textContent = `${formatTime(t)} / ${formatTime(video.duration)}`;
}

// === Controls ===
playBtn.addEventListener('click', () => {
  if (video.paused) { video.play(); playBtn.textContent = '⏸'; isPlaying = true; }
  else { video.pause(); playBtn.textContent = '▶'; isPlaying = false; }
});

video.addEventListener('ended', () => { playBtn.textContent = '▶'; isPlaying = false; });

seekBar.addEventListener('input', () => {
  if (video.duration) video.currentTime = (seekBar.value / 1000) * video.duration;
});

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    video.playbackRate = parseFloat(btn.dataset.speed);
  });
});

// Animation loop for smooth sync
function tick() {
  if (isPlaying) syncToVideo();
  requestAnimationFrame(tick);
}
tick();

// === File handling ===
document.getElementById('videoUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  document.getElementById('dropZone').classList.add('hidden');
  video.load();
  // Reset
  currentIdx = 0;
  document.getElementById('eventsLog').innerHTML = '';
});

document.getElementById('timelineUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      timeline = JSON.parse(ev.target.result);
      updateDashboard(timeline[0]);
    } catch(err) { alert('JSON解析失败: ' + err.message); }
  };
  reader.readAsText(file);
});

// Drop zone
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('click', () => document.getElementById('videoUpload').click());
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) {
    video.src = URL.createObjectURL(file);
    dropZone.classList.add('hidden');
    video.load();
  }
});

// === Load default demo ===
async function loadDefaultVideo() {
  // Load original video (H.264, browser-compatible) + pre-computed timeline
  try {
    video.src = '/223067.MP4';
    dropZone.classList.add('hidden');
    video.load();

    const resp = await fetch('/data/live_demo/timeline.json');
    if (resp.ok) {
      timeline = await resp.json();
      updateDashboard(timeline[0]);
    }
  } catch(e) {
    alert('加载失败: ' + e.message);
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.code === 'ArrowRight') video.currentTime += 5;
  if (e.code === 'ArrowLeft') video.currentTime -= 5;
});
</script>
</body>
</html>
